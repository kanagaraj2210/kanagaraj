# Temporary: validates TerminalToTV on a real Windows machine. Removed again before merge.
name: TerminalToTV Windows check
on:
  push:
    branches: [claude/trading-terminal-tv-display-y5dql2]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Line endings after checkout
        shell: powershell
        run: |
          foreach ($f in 'TerminalToTV\TerminalToTV.bat', 'TerminalToTV\TerminalToTV.ps1') {
            $text = [IO.File]::ReadAllText("$PWD\$f")
            "{0}: CRLF={1}" -f $f, ($text -match "`r`n")
          }

      - name: Parse + compile with Windows PowerShell 5.1 (warnings would fail this)
        shell: powershell
        run: |
          "PowerShell " + $PSVersionTable.PSVersion
          $src = [IO.File]::ReadAllText("$PWD\TerminalToTV\TerminalToTV.ps1")
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$tokens, [ref]$errors)
          "parse errors: $($errors.Count)"; if ($errors.Count) { $errors; exit 1 }
          $code = [regex]::Match($src, "(?s)-TypeDefinition @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          Add-Type -TypeDefinition $code
          "compiled OK, no warnings"

      - name: Compile with PowerShell 7
        shell: pwsh
        run: |
          $src = [IO.File]::ReadAllText("$PWD\TerminalToTV\TerminalToTV.ps1")
          $code = [regex]::Match($src, "(?s)-TypeDefinition @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          Add-Type -TypeDefinition $code
          "PowerShell $($PSVersionTable.PSVersion): compiled OK"

      - name: Real Win32 calls (displays, windows, moving a window)
        shell: powershell
        run: |
          $src = [IO.File]::ReadAllText("$PWD\TerminalToTV\TerminalToTV.ps1")
          $code = [regex]::Match($src, "(?s)-TypeDefinition @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          Add-Type -IgnoreWarnings -TypeDefinition $code
          Add-Type -Namespace T -Name W -MemberDefinition '
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool IsZoomed(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);'
          $N = [TerminalToTV.Native]
          "connected screens: " + $N::CountConnectedScreens()
          "active screens:    " + $N::CountActiveScreens()
          $displays = @($N::GetDisplays())
          $displays | Format-Table DeviceName, Name, Technology, Connection, Screens, IsPrimary, Left, Top, Width, Height -AutoSize | Out-String -Width 200
          $all = @($N::GetWindows())
          "top-level windows found: $($all.Count)"
          $all | Format-Table ProcessId, ProcessName, ClassName, Title -AutoSize | Out-String -Width 250

          $p = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 3
          $w = @($N::GetWindows() | Where-Object ProcessId -eq $p.Id)
          $w | Format-List | Out-String -Width 200
          if ($w.Count -lt 1) { throw 'notepad window not found' }
          $h = $w[0].Handle
          $dev = $displays[0].DeviceName
          $fail = 0
          function Check($label, $result) {
            $ok = ($result -eq '') -and [T.W]::IsZoomed($h) -and -not [T.W]::IsIconic($h) -and $N::IsOnDisplay($h, $dev)
            "{0,-32} result='{1}' maximized={2} minimized={3} onDisplay={4} -> {5}" -f $label, $result, [T.W]::IsZoomed($h), [T.W]::IsIconic($h), $N::IsOnDisplay($h, $dev), $(if ($ok) {'OK'} else {'FAIL'})
            if (-not $ok) { $script:fail++ }
          }
          [void][T.W]::ShowWindow($h, 9); Start-Sleep 1
          Check 'from normal window' ($N::MoveToDisplay($h, $dev))
          Check 'from maximized window' ($N::MoveToDisplay($h, $dev))
          [void][T.W]::ShowWindow($h, 9); Start-Sleep 1; [void][T.W]::ShowWindow($h, 6); Start-Sleep 1
          Check 'from minimized window' ($N::MoveToDisplay($h, $dev))
          [void][T.W]::ShowWindow($h, 3); Start-Sleep 1; [void][T.W]::ShowWindow($h, 6); Start-Sleep 1
          Check 'from minimized-after-maximized' ($N::MoveToDisplay($h, $dev))
          "missing screen -> '" + $N::MoveToDisplay($h, '\\.\DISPLAY99') + "'"
          "bad window     -> '" + $N::MoveToDisplay([IntPtr]12345, $dev) + "'"
          "ExtendDesktop on this machine returned " + $N::ExtendDesktop()
          Stop-Process -Id $p.Id
          if ($fail) { throw "$fail window move checks failed" }

      - name: Whole script end-to-end (no TV on this machine, so it must stop cleanly)
        shell: powershell
        run: |
          $p = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 3
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\TerminalToTV\TerminalToTV.ps1" -Match Notepad -WaitSeconds 4 *>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          "exit code: $code"
          Stop-Process -Id $p.Id
          if ($code -ne 1 -or $out -notmatch 'Terminal: .*Notepad' -or $out -notmatch 'did not connect') { throw 'unexpected result' }
          'script behaved as expected'

      - name: The .bat launcher (pause on error must not hang)
        shell: powershell
        run: |
          $p = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 3
          $out = cmd.exe /c "echo.| TerminalToTV\TerminalToTV.bat -Match Notepad -WaitSeconds 3" 2>&1 | Out-String
          $out
          Stop-Process -Id $p.Id
          if ($out -notmatch 'did not connect') { throw 'bat did not run the script' }
          'bat launcher OK'

      - name: Real MetaTrader 5 window (install MT5, detect it, move it)
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $setup = "$env:RUNNER_TEMP\mt5setup.exe"
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup
          Start-Process $setup -ArgumentList '/auto' -Wait
          $exe = Get-ChildItem 'C:\Program Files\MetaTrader 5*\terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem 'C:\Program Files\*\terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          "terminal64: $($exe.FullName)"
          if (-not (Get-Process terminal64 -ErrorAction SilentlyContinue)) { Start-Process $exe.FullName }
          Start-Sleep -Seconds 40
          $src = [IO.File]::ReadAllText("$PWD\TerminalToTV\TerminalToTV.ps1")
          $code = [regex]::Match($src, "(?s)-TypeDefinition @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          Add-Type -IgnoreWarnings -TypeDefinition $code
          [TerminalToTV.Native]::GetWindows() | Where-Object ProcessName -eq 'terminal64' | Format-List | Out-String -Width 250
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\TerminalToTV\TerminalToTV.ps1" -WaitSeconds 3 *>&1 | Out-String
          $out
          $w = @([TerminalToTV.Native]::GetWindows() | Where-Object ProcessName -eq 'terminal64')
          $d = @([TerminalToTV.Native]::GetDisplays())[0]
          foreach ($x in $w) { "move MT5 window '$($x.Title)' -> '" + [TerminalToTV.Native]::MoveToDisplay($x.Handle, $d.DeviceName) + "'" }
