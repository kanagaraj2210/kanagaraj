# Temporary: validates TerminalToTV.mq5 in a real MetaTrader 5 on Windows. Removed again before merge.
name: TerminalToTV MQL5 check
on:
  push:
    branches: [claude/trading-terminal-tv-display-y5dql2]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: powershell
        timeout-minutes: 10
        run: |
          $setup = "$env:RUNNER_TEMP\mt5setup.exe"
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup
          Start-Process $setup -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 20
          Get-Process terminal64, metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-ChildItem 'C:\Program Files\MetaTrader 5' | Select-Object Name | Format-Table -AutoSize | Out-String

      - name: Compile with MetaEditor64 (/compile + /log), hash source and EX5
        shell: powershell
        run: |
          $mt5 = 'C:\Program Files\MetaTrader 5'
          $src = "$PWD\TerminalToTV\TerminalToTV.mq5"
          $ex5 = "$PWD\TerminalToTV\TerminalToTV.ex5"
          $log = "$env:RUNNER_TEMP\compile.log"
          if (Test-Path $ex5) { throw 'stale EX5 present before compile' }
          $before = Get-Date
          Start-Process "$mt5\MetaEditor64.exe" -ArgumentList "/compile:$src", "/log:$log" -Wait
          Get-Content -LiteralPath $log
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -notmatch 'Result: 0 errors, 0 warnings') { throw 'compile did not end with 0 errors, 0 warnings' }
          $item = Get-Item -LiteralPath $ex5
          if ($item.LastWriteTime -lt $before) { throw 'EX5 is not fresh' }
          Get-Item -LiteralPath $src, $ex5 | Select-Object Name, Length, LastWriteTimeUtc | Format-Table -AutoSize | Out-String
          Get-FileHash -LiteralPath $src, $ex5 -Algorithm SHA256 | Format-Table Hash, Path -AutoSize | Out-String -Width 250

      - name: Run the script inside MT5 (startup config, DLL imports allowed)
        shell: powershell
        run: |
          $mt5 = 'C:\Program Files\MetaTrader 5'
          New-Item -ItemType Directory -Force "$mt5\MQL5\Scripts", "$mt5\MQL5\Presets" | Out-Null
          Copy-Item "$PWD\TerminalToTV\TerminalToTV.ex5" "$mt5\MQL5\Scripts\TerminalToTV.ex5" -Force
          $built = (Get-FileHash "$PWD\TerminalToTV\TerminalToTV.ex5").Hash
          $deployed = (Get-FileHash "$mt5\MQL5\Scripts\TerminalToTV.ex5").Hash
          "deployed EX5 matches built EX5: $($built -eq $deployed)"
          'InpScreen=1', 'InpWaitSeconds=5' | Out-File "$mt5\MQL5\Presets\TerminalToTV-main.set" -Encoding Unicode
          'InpScreen=0', 'InpWaitSeconds=5' | Out-File "$mt5\MQL5\Presets\TerminalToTV-tv.set" -Encoding Unicode
          $fail = 0

          function Run-Script($preset, [string[]]$mustContain) {
            $cfg = "$env:RUNNER_TEMP\start-$preset.ini"
            @('[Experts]', 'AllowLiveTrading=0', 'AllowDllImport=1', 'Enabled=1',
              '[StartUp]', 'Script=TerminalToTV', "ScriptParameters=$preset.set", 'Symbol=EURUSD', 'Period=H1') |
              Out-File $cfg -Encoding Unicode
            Get-ChildItem "$mt5\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | Remove-Item -Force
            Start-Process "$mt5\terminal64.exe" -ArgumentList '/portable', "/config:$cfg"
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 5
              $experts = (Get-ChildItem "$mt5\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join "`n"
            } while ((Get-Date) -lt $deadline -and $experts -notmatch 'removed|vandhaachu|Mudinjadhu|TV connect aagala')
            Start-Sleep -Seconds 5
            $experts = (Get-ChildItem "$mt5\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join "`n"
            "==================== $preset : Experts log"
            $experts
            "==================== $preset : terminal journal (tail)"
            Get-ChildItem "$mt5\logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName | Select-Object -Last 25 }
            foreach ($m in $mustContain) {
              if (-not $experts.Contains($m)) { "   MISSING: $m"; $script:fail++ } else { "   ok: $m" }
            }
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
          }

          # InpScreen=1: moves the terminal window to the PC main screen (the only screen here) - real move path
          Run-Script 'TerminalToTV-main' @('Screen 1:', 'PC main screen', 'Terminal-ai screen 1-ku move panren', 'Terminal PC screen-ku vandhaachu')
          # InpScreen=0 (TV) on a machine with one screen: Extend fails, Cast panel opens, gives up after 5 s with an Alert
          Run-Script 'TerminalToTV-tv' @('TV innum connect aagala', 'TV connect aagala / innum mirror-la irukku')

          if ($fail) { "$fail checks failed"; exit 1 }
          'MQL5 script ran as expected'
          exit 0

      - name: Windows Defender scan (which file does it flag?)
        shell: powershell
        continue-on-error: true
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, IsTamperProtected, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List | Out-String
          try { Update-MpSignature -ErrorAction Stop; 'signatures updated' } catch { "signature update failed: $_" }
          (Get-MpComputerStatus).AntivirusSignatureVersion
          Invoke-WebRequest 'https://github.com/kanagaraj2210/kanagaraj/archive/refs/heads/master.zip' -OutFile "$env:RUNNER_TEMP\kanagaraj-master.zip"
          $scan = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          foreach ($target in @("$env:RUNNER_TEMP\kanagaraj-master.zip") + (Get-ChildItem "$PWD\TerminalToTV" -File | ForEach-Object FullName)) {
            "---- scan $target"
            & $scan -Scan -ScanType 3 -File $target -DisableRemediation 2>&1 | Out-String
          }
          Get-MpThreatDetection | Format-List | Out-String -Width 250
          Get-MpThreat | Format-List | Out-String -Width 250
